    color: var(--text);

    min-height: 100vh;
    position: relative;

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 28, 0.35);
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 1rem;
  }
  input[type="text"]:focus { outline: none; border-color: var(--green); }
  button {
    padding: 12px 20px;
    background: var(--green);
    color: #04231a;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { background: #2c3a42; color: var(--muted); cursor: not-allowed; }
  button:hover:not(:disabled) { background: var(--green-dark); }
  .status {
    padding: 12px 14px;
    border-radius: 6px;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    font-size: 0.9rem;
    display: none;
  }
  .status.show { display: block; }
  .status.error { border-color: #d9534f; color: #ff8b85; }
  .summary {
    display: none;
    gap: 12px;
    margin-bottom: 20px;
  }
  .summary.show { display: flex; }
  .stat {
    flex: 1;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    text-align: center;
  }
  .stat .num { font-size: 1.5rem; font-weight: 700; color: #fff; }
  .stat .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  ul.results { list-style: none; margin: 0; padding: 0; }
  li.person {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  li.person img {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    background: var(--bg-alt);
    object-fit: cover;
  }
  li.person a.name {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  li.person a.name:hover { color: var(--green); }
  li.person .handle { color: var(--muted); font-size: 0.8rem; }
  .empty-msg {
    color: var(--muted);
    padding: 20px;
    text-align: center;
    background: var(--bg-alt);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .site-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    padding: 10px 16px;
    background: transparent;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .site-footer .footer-icons {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .site-footer .footer-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text);
    text-decoration: none;
    transition: border-color 0.15s, color 0.15s, transform 0.15s;
  }
  .site-footer .footer-btn svg {
    width: 16px;
    height: 16px;
    display: block;
  }
  .site-footer .footer-btn:hover {
    border-color: var(--green);
    color: var(--green);
    transform: translateY(-1px);
  }
</style>
</head>

<div class="wrap">
  <h1>Who Doesn't Follow You Back</h1>
  <div class="subtitle">Enter a Letterboxd username to see who they follow that doesn't follow them back.</div>

  <div class="form-row">
    <input type="text" id="username" placeholder="letterboxd username" autocomplete="off" />

  </div>
</footer>

<script>
// Replace this with your deployed Cloudflare Worker URL (see setup guide).
// Example: "https://letterboxd-proxy.yourname.workers.dev"
const WORKER_URL = "https://letterboxd.mohamadmostafa79.workers.dev";

const MAX_RETRIES = 3;
const REQUEST_TIMEOUT_MS = 15000;

const statusEl = document.getElementById("status");
const summaryEl = document.getElementById("summary");
const resultsEl = document.getElementById("results");
const btn = document.getElementById("checkBtn");
const input = document.getElementById("username");

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = "status show" + (isError ? " error" : "");
}

function clearStatus() {
  statusEl.className = "status";
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function fetchWithTimeout(url, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { signal: controller.signal, headers: { "Accept": "text/html,*/*" } });
  } finally {
    clearTimeout(timer);
  }
}

async function fetchPage(targetUrl, onAttempt) {
  const proxyUrl = WORKER_URL + "?url=" + encodeURIComponent(targetUrl);
  let lastError;

  for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
    try {
      if (onAttempt) onAttempt(attempt);
      const res = await fetchWithTimeout(proxyUrl, REQUEST_TIMEOUT_MS);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (!text || text.length < 50) throw new Error("empty response");
      return text;
    } catch (err) {
      lastError = (err && err.name === "AbortError")
        ? new Error("timed out after " + (REQUEST_TIMEOUT_MS / 1000) + "s")
        : err;
      if (attempt < MAX_RETRIES) await sleep(1000 * attempt);
    }
  }

  throw new Error("Worker request failed after " + MAX_RETRIES + " attempts: " +
    (lastError && lastError.message ? lastError.message : String(lastError)));
}

function parsePeople(html, currentUsername) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const anchors = Array.from(doc.querySelectorAll("a[href]"));
  const followersLinkPattern = /^\/([A-Za-z0-9_]+)\/followers\/?$/;
  const seenHandles = new Set();
  const people = [];

  anchors.forEach(a => {
    const href = a.getAttribute("href") || "";
    const match = href.match(followersLinkPattern);
    if (!match) return;
    const handle = match[1];
    if (handle.toLowerCase() === currentUsername.toLowerCase()) return;
    if (seenHandles.has(handle)) return;
    seenHandles.add(handle);

    let displayName = handle;
    let avatar = "";
    doc.querySelectorAll('a[href="/' + handle + '/"]').forEach(link => {
      const text = link.textContent.trim();
      if (text) displayName = text;
      const img = link.querySelector("img");
      if (img) {
        const src = img.getAttribute("src");
        if (src) avatar = src;
      }
    });

    people.push({ handle, displayName, avatar });
  });

  return people;
}

function hasNextPage(html, username, kind, currentPage) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const nextHref = "/" + username + "/" + kind + "/page/" + (currentPage + 1) + "/";
  return Array.from(doc.querySelectorAll("a[href]")).some(a => {
    const href = a.getAttribute("href") || "";
    return href === nextHref || href.endsWith(nextHref);
  });
}

async function fetchAllPeople(username, kind, onProgress) {
  const people = [];
  const seen = new Set();
  let page = 1;
  const MAX_PAGES = 200;

  while (page <= MAX_PAGES) {
    const url = "https://letterboxd.com/" + username + "/" + kind + "/page/" + page + "/";
    const html = await fetchPage(url, attempt => {
      onProgress(kind, page, attempt);
    });

    if (page === 1 && /Sorry, we can.t find the page/i.test(html)) {
      throw new Error("User not found: " + username);
    }

    const pagePeople = parsePeople(html, username);
    if (pagePeople.length === 0) break;

    pagePeople.forEach(p => {
      if (!seen.has(p.handle)) {
        seen.add(p.handle);
        people.push(p);
      }
    });

    if (!hasNextPage(html, username, kind, page)) break;
    page += 1;
  }

  return people;
}

function renderResults(notFollowingBack) {
  resultsEl.innerHTML = "";
  if (notFollowingBack.length === 0) {
    const li = document.createElement("li");
    li.className = "empty-msg";
    li.textContent = "Everyone they follow, follows them back.";
    resultsEl.appendChild(li);
    return;
  }
  notFollowingBack.forEach(p => {
    const li = document.createElement("li");
    li.className = "person";
    const img = document.createElement("img");
    img.src = p.avatar || "";
    img.alt = "";
    img.onerror = () => { img.style.visibility = "hidden"; };
    const info = document.createElement("div");
    const nameLink = document.createElement("a");
    nameLink.className = "name";
    nameLink.href = "https://letterboxd.com/" + p.handle + "/";
    nameLink.target = "_blank";
    nameLink.rel = "noopener";
    nameLink.textContent = p.displayName;
    const handleSpan = document.createElement("div");
    handleSpan.className = "handle";
    handleSpan.textContent = "@" + p.handle;
    info.appendChild(nameLink);
    info.appendChild(handleSpan);
    li.appendChild(img);
    li.appendChild(info);
    resultsEl.appendChild(li);
  });
}

async function runCheck() {
  const username = input.value.trim().replace(/^@/, "");
  if (!username) {
    setStatus("Enter a username first.", true);
    return;
  }

  if (!WORKER_URL || WORKER_URL.includes("YOUR-WORKER-NAME")) {
    setStatus("Set WORKER_URL at the top of the script to your deployed Cloudflare Worker URL first.", true);
    return;
  }

  btn.disabled = true;
  summaryEl.className = "summary";
  resultsEl.innerHTML = "";
  clearStatus();

  try {
    setStatus("Fetching who " + username + " follows...", false);
    const following = await fetchAllPeople(username, "following", (kind, page, attempt) => {
      setStatus("Fetching following list, page " + page + (attempt > 1 ? " (retry " + attempt + ")" : "") + "...", false);
    });

    setStatus("Fetching " + username + "'s followers...", false);
    const followers = await fetchAllPeople(username, "followers", (kind, page, attempt) => {
      setStatus("Fetching followers list, page " + page + (attempt > 1 ? " (retry " + attempt + ")" : "") + "...", false);
    });

    const followerHandles = new Set(followers.map(p => p.handle));
    const notFollowingBack = following.filter(p => !followerHandles.has(p.handle));

    document.getElementById("numFollowing").textContent = following.length;
    document.getElementById("numFollowers").textContent = followers.length;
    document.getElementById("numNotBack").textContent = notFollowingBack.length;
    summaryEl.className = "summary show";

    clearStatus();
    renderResults(notFollowingBack);
  } catch (err) {
    setStatus("Error: " + err.message, true);
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", runCheck);
input.addEventListener("keydown", e => {
  if (e.key === "Enter") runCheck();
});
</script>
</body>
</html>
